name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/sopm

jobs:
  # ===========================================================================
  # Lint
  # ===========================================================================
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy api/ worker/ shared/ scheduler/ sandbox/ --ignore-missing-imports

  # ===========================================================================
  # Security scan
  # ===========================================================================
  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: bandit -r api/ worker/ shared/ scheduler/ sandbox/ -c pyproject.toml

  # ===========================================================================
  # Tests
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sopm_test
          POSTGRES_USER: sopm
          POSTGRES_PASSWORD: sopm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://sopm:sopm_test@localhost:5432/sopm_test
      DATABASE_URL_SYNC: postgresql+psycopg2://sopm:sopm_test@localhost:5432/sopm_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test_secret_key_minimum_32_chars_long_pad
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: test_access
      MINIO_SECRET_KEY: test_secret_key
      SANDBOX_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]" aiosqlite

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # Docker Build + Trivy Scan
  # ===========================================================================
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        component:
          - name: api
            dockerfile: deploy/docker/Dockerfile.api
            image: sopm-api
          - name: worker
            dockerfile: deploy/docker/Dockerfile.worker
            image: sopm-worker
          - name: runner
            dockerfile: deploy/docker/Dockerfile.runner
            image: sopm-runner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.component.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component.name }}.sarif

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

  # ===========================================================================
  # Deploy to dev (on main push only)
  # ===========================================================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Deploy
        run: |
          kubectl set image deployment/sopm-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-sopm-api:${{ github.sha }} \
            -n sopm
          kubectl set image deployment/sopm-worker \
            worker=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-sopm-worker:${{ github.sha }} \
            -n sopm
          kubectl rollout status deployment/sopm-api -n sopm --timeout=120s
          kubectl rollout status deployment/sopm-worker -n sopm --timeout=120s
