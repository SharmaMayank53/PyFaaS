[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sopm"
version = "0.1.0"
description = "Python Functions-as-a-Service Platform"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Queue
    "redis[hiredis]>=5.0.4",
    "rq>=1.16.2",

    # Storage
    "minio>=7.2.7",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",

    # Validation / serialization
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # Kubernetes
    "kubernetes>=30.1.0",

    # Observability
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",

    # Scheduling
    "croniter>=2.0.5",

    # Utilities
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1",
    "anyio>=4.4.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.1",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
    "types-redis>=4.6.0.20240417",
    "types-passlib>=1.7.7.20240327",
    "types-python-jose>=3.3.4.20240106",
]


[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "ANN", "S", "B", "C4", "PT"]
ignore = ["ANN101", "ANN102", "ANN401", "S101"]

[tool.ruff.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["tests/*", "migrations/*", "*/conftest.py"]

[tool.bandit]
skips = ["B101", "B601"]

[tool.hatch.build.targets.wheel]
packages = ["api", "worker", "shared", "scheduler", "sandbox", "sopm_mcp"]


